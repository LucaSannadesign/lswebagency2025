    - thursday
    - saturday

workflow:
  humanApprovalRequired: true
  automaticPublishing: false
  cannibalizationCheckRequired: true
  previewRequired: true
  articleAuthor: Luca Sanna

articleDefaults:
  contentDirectory: src/content/data/post
  draft: true
  robots: "noindex, nofollow"
  metadataProfile: full-seo-ai-social
  structuredData:
    - Article
    - BreadcrumbList
    - FAQPage_when_applicable

  featuredImage:
    required: true
    generateWhen: article_draft_created
    approvalRequired: true
    primary:
      width: 1200
      height: 630
      format: webp
    socialVariant:
      width: 1080
      height: 1350
      format: webp

  requiredMetadata:
    - title
    - description
    - slug
    - canonical
    - focusKeyword
    - tags
    - category
    - author
    - publishDate
    - updateDate
    - image
    - imageAlt
    - ogTitle
    - ogDescription
    - ogImage
    - ogType
    - twitterCard
    - twitterTitle
    - twitterDescription
    - twitterImage
    - robots
    - draft

