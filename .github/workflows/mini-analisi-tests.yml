name: Mini-analisi — regression tests
on:
  pull_request:
    paths:
      - 'src/components/MiniAnalisi.tsx'
      - 'src/pages/api/mini-analisi.ts'
      - 'tests/miniAnalisi*.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mini-analisi-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests without production credentials
        run: npm run test:unit
