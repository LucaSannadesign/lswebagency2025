name: Verifica modulo turismo

on:
  pull_request:
    paths:
      - 'src/lib/tourismInquiry.ts'
      - 'src/pages/api/richieste-dirette.ts'
      - 'src/pages/transizione-digitale-turismo.astro'
      - 'tests/tourismInquiry.test.mjs'
      - 'package.json'
      - '.github/workflows/tourism-form-unit.yml'

permissions:
  contents: read

jobs:
  test-modulo-turismo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: '22'
      - name: Test input, privacy, honeypot e collegamento endpoint
        run: node --experimental-strip-types --test tests/tourismInquiry.test.mjs
